name: Build Windows Installer

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi installer, contoh 1.0.0'
        required: false
        default: ''

  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: 'x64'
          cache: 'pip'

      - name: Determine version
        shell: pwsh
        run: |
          $requested = "${{ inputs.version }}"
          if ($requested) {
            $version = $requested
          } elseif ("${{ github.ref }}" -like "refs/tags/v*") {
            $version = "${{ github.ref_name }}"
          } else {
            $version = "0.1.${{ github.run_number }}"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Building version $version"

      - name: Ensure Inno Setup
        shell: pwsh
        run: |
          $paths = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles}\Inno Setup 6\ISCC.exe"
          )
          $found = $paths | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $found) {
            choco install innosetup --no-progress -y
          } else {
            Write-Host "Inno Setup found: $found"
          }

      - name: Build installer
        shell: pwsh
        run: .\build_windows.ps1 -Version $env:APP_VERSION

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: KK-Scanner-Setup-${{ env.APP_VERSION }}
          path: installer/output/KK-Scanner-Setup-*.exe
          if-no-files-found: error
          retention-days: 30

  release:
    needs: build-windows
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Generate release notes
        shell: bash
        run: |
          TAG_NAME="${{ github.ref_name }}"
          echo "# Release $TAG_NAME" > RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md
          echo "## Details" >> RELEASE_NOTES.md
          echo "- Windows installer build generated automatically from GitHub Actions." >> RELEASE_NOTES.md
          echo "- Artifact attached directly to this GitHub Release." >> RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.exe
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}